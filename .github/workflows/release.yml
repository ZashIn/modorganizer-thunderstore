name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ASSET_FILE: thunderstore-${{ github.ref_name }}.zip
  CHANGELOG: CHANGELOG.md

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Poetry
        uses: ZashIn/setup-poetry@v1
        with:
          python-version: 3.12
          poetry-install-options: --no-root
      - name: Check code
        id: check-code
        run: poetry run poe lint

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.12, 3.13]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      # - name: Setup C/C++ Compiler
      #   uses: rlalik/setup-cpp-compiler@v1.2
      - name: Setup Poetry
        uses: ZashIn/setup-poetry@v1
        with:
          python-version: ${{ matrix.python-version }}
          poetry-install-options: --no-root --with build
      - name: Build exe with Python ${{ matrix.python-version }}
        run: poetry run poe build
      - uses: actions/upload-artifact@v4
        with:
          name: thunderstore_protocol_handler_python${{ matrix.python-version }}
          path: thunderstore/protocol/*.exe
          overwrite: true

  release:
    needs: [test, build]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: thunderstore/protocol
          pattern: thunderstore_protocol_handler*
          merge-multiple: true
      - name: Pack Module
        shell: bash
        run: ./pack-release.sh "$GITHUB_REF_NAME" "$ASSET_FILE"
      - name: Create release notes from changelog
        shell: bash
        run: |-
          echo -e "# Changes\n" > RELEASE.md
          version="${GITHUB_REF_NAME#v}"
          # For patch version with missing changelog entry, match minor version, too.
          if [[ $version =~ ([0-9]+\.[0-9]+)\.[0-9]+ ]]; then
              version="($version|${BASH_REMATCH[1]}[.0-9]*)"
              echo $version
          fi
          # Find relevant part in changelog (## $version ... ## )
          grep -Pazo "(?sm)^## \[?v?$version\]?\s.+?(?=\Z|^\n?## )" $CHANGELOG | tr -d '\0' >> RELEASE.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_FILE }}
          body_path: RELEASE.md
          draft: true